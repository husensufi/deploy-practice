<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GynoBuddy AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-shell">

    <div class="topbar">
      <div class="brand-row" style="margin-bottom:0;">
        <div class="brand-mark"></div>
        <div class="brand-name" data-i18n="app_name">Ashwini Asangi PCOS GynoCare</div>
      </div>
      <div class="nav-links">
        <a href="/home" data-i18n="nav_home">Home</a>
        <a href="/tracker" data-i18n="nav_tracker">Daily Tracker</a>
        <a href="/yoga" data-i18n="nav_yoga">Yoga & Exercise</a>
        <a href="/games" data-i18n="nav_games">Games</a>
        <a href="/chatbot" data-i18n="nav_chatbot">GynoBuddy AI</a>
        <a href="/connections" data-i18n="nav_friends">Friends & Family</a>
        <div class="lang-switch" style="margin-bottom:0;">
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="hi">HI</button>
          <button class="lang-btn" data-lang="kn">KN</button>
        </div>
        <a href="/logout" data-i18n="nav_logout">Logout</a>
      </div>
    </div>

    <div class="hero-panel" style="max-width: 700px;">
      <h2 data-i18n="nav_chatbot">GynoBuddy AI</h2>
      <p style="color:#6E5F6C; margin-top:4px;" data-i18n="chatbot_subtitle">
        A caring AI companion to talk to — about your day, symptoms, cravings, or anything on your mind. Not a doctor, just a friendly ear.
      </p>

      <div class="chat-window" id="chat-window"></div>

      <form id="chatbot-form" class="chat-input-row">
        <input type="text" id="chatbot-input" data-i18n="type_message" placeholder="Type a message..." autocomplete="off">
        <button type="submit" class="btn-primary" style="width:auto; padding:12px 22px;" data-i18n="send">Send</button>
      </form>
    </div>

  </div>

  <script src="/static/js/lang.js"></script>
  <script>
    const chatWindow = document.getElementById("chat-window");
    const form = document.getElementById("chatbot-form");
    const input = document.getElementById("chatbot-input");

    let history = [];

    function addBubble(text, mine) {
      const bubble = document.createElement("div");
      bubble.className = "chat-bubble " + (mine ? "mine" : "theirs");
      bubble.textContent = text;
      chatWindow.appendChild(bubble);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    addBubble("Hi, I'm GynoBuddy 💗 How are you feeling today?", false);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addBubble(text, true);
      history.push({ role: "user", content: text });
      input.value = "";

      const typing = document.createElement("div");
      typing.className = "chat-bubble theirs";
      typing.textContent = "…";
      chatWindow.appendChild(typing);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      try {
        const res = await fetch("/api/chatbot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history }),
        });
        const data = await res.json();
        typing.remove();
        addBubble(data.reply, false);
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        typing.remove();
        addBubble("Something went wrong reaching GynoBuddy. Please try again.", false);
      }
    });
  </script>
</body>
</html>
